<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Hyundai Marketing Planner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto; background: #f5f7fa; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #003da5 0%, #001f4d 100%); color: white; padding: 25px; border-radius: 12px; margin-bottom: 30px; gap: 20px; flex-wrap: wrap; }
        header h1 { font-size: 28px; font-weight: 700; }
        header img { height: 45px; }
        
        .header-right { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .location-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .loc-btn { padding: 10px 16px; border: 2px solid white; background: transparent; color: white; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .loc-btn.active { background: white; color: #003da5; }
        .loc-btn:hover { background: rgba(255,255,255,0.2); }
        
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .metric-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid #003da5; }
        .metric-label { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        .metric-value { font-size: 28px; font-weight: 700; color: #003da5; }
        
        .dashboard-section { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #003da5; }
        
        .breakdown-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .breakdown-item { padding: 15px; background: #f9fafb; border-radius: 8px; border-left: 4px solid #003da5; }
        .breakdown-item-name { font-weight: 600; margin-bottom: 8px; }
        .breakdown-item-value { font-size: 20px; font-weight: 700; color: #003da5; }
        
        .location-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .location-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 4px solid #003da5; cursor: pointer; transition: all 0.2s; }
        .location-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; color: #003da5; }
        .card-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .card-stat-label { color: #666; }
        .card-stat-value { font-weight: 700; }
        
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; }
            .metrics { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

        <header>
            <div style="display: flex; align-items: center; gap: 15px;">

            </div>
            <div class="header-right">
                <div class="location-buttons" id="locButtons"></div>
            </div>
        </header>

        <!-- Top Metrics -->
        <div class="metrics" id="topMetrics"></div>

        <!-- Type Breakdown -->
        <div class="dashboard-section">
            <div class="section-title">📊 Spend by Campaign Type</div>
            <div class="breakdown-list" id="typeBreakdown"></div>
        </div>

        <!-- Category Breakdown -->
        <div class="dashboard-section">
            <div class="section-title">📂 Spend by Category</div>
            <div class="breakdown-list" id="categoryBreakdown"></div>
        </div>

        <!-- Location Cards -->
        <div class="dashboard-section">
            <div class="section-title">📍 Location Summary</div>
            <div class="location-cards" id="locationCards"></div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyhMqpQ_6BfigozBGe6FHhP_mPI5QzS_ugC6R8PqTNP-Mk445JchXV41a8O9x2Gv9rb/exec';
        const formatter = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
        let allLocations = [];

        async function init() {
            try {
                // Get dashboard summary
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getDashboardSummary`);
                const data = await res.json();
                
                allLocations = data.locations;
                
                // Render location buttons
                let btnHtml = '';
                data.locations.forEach(loc => {
                    btnHtml += `<button class="loc-btn" onclick="alert('Location: ${loc.name}\\n\\nThis is a dashboard view. Planner coming soon!')">${loc.name}</button>`;
                });
                document.getElementById('locButtons').innerHTML = btnHtml;
                
                // Top metrics
                const avgSpend = data.totalUnits > 0 ? data.totalSpend / data.totalUnits : 0;
                const metricsHtml = `
                    <div class="metric-box">
                        <div class="metric-label">Total Spend</div>
                        <div class="metric-value">${formatter.format(data.totalSpend)}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Target Units</div>
                        <div class="metric-value">${data.totalUnits.toLocaleString()}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Spend Per Unit</div>
                        <div class="metric-value">${formatter.format(avgSpend)}</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-label">Locations</div>
                        <div class="metric-value">${data.locations.length}</div>
                    </div>
                `;
                document.getElementById('topMetrics').innerHTML = metricsHtml;
                
                // Type breakdown
                let typeHtml = '';
                Object.entries(data.byType).sort((a, b) => b[1] - a[1]).forEach(([type, spend]) => {
                    typeHtml += `<div class="breakdown-item">
                        <div class="breakdown-item-name">${type}</div>
                        <div class="breakdown-item-value">${formatter.format(spend)}</div>
                    </div>`;
                });
                document.getElementById('typeBreakdown').innerHTML = typeHtml;
                
                // Category breakdown
                let catHtml = '';
                Object.entries(data.byCategory).sort((a, b) => b[1] - a[1]).forEach(([cat, spend]) => {
                    catHtml += `<div class="breakdown-item">
                        <div class="breakdown-item-name">${cat}</div>
                        <div class="breakdown-item-value">${formatter.format(spend)}</div>
                    </div>`;
                });
                document.getElementById('categoryBreakdown').innerHTML = catHtml;
                
                // Location cards
                let locHtml = '';
                data.locations.forEach(loc => {
                    locHtml += `<div class="location-card">
                        <div class="card-title">${loc.name}</div>
                        <div class="card-stat">
                            <span class="card-stat-label">Annual Spend:</span>
                            <span class="card-stat-value">${formatter.format(loc.spend)}</span>
                        </div>
                        <div class="card-stat">
                            <span class="card-stat-label">Target Units:</span>
                            <span class="card-stat-value">${loc.units}</span>
                        </div>
                        <div class="card-stat">
                            <span class="card-stat-label">Spend/Unit:</span>
                            <span class="card-stat-value">${formatter.format(loc.spendPerUnit)}</span>
                        </div>
                    </div>`;
                });
                document.getElementById('locationCards').innerHTML = locHtml;
                
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('topMetrics').innerHTML = '<p style="color: red;">Error loading dashboard</p>';
            }
        }

        init();
    </script>
</body>
</html>
